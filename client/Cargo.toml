[package]
name = "eld-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "HTTP client, CWD config, wallets, and CLI helpers for Eld"
readme = "README.md"
authors = ["Gunnar H. Karlsson <gunnar.h.karlsson@gmail.com>"]
repository = "https://github.com/eldnetwork/eld-chain"
homepage = "https://github.com/eldnetwork/eld-chain"
documentation = "https://docs.rs/eld-client"
keywords = ["blockchain", "tendermint", "rpc", "http"]
categories = ["cryptocurrency", "network-programming"]
include = [
    "src/**",
    "examples/**",
    "config/*.json.example",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
    "TYPE_DESIGN.md",
    "CHANGELOG.md",
]

[[example]]
name = "query_account"
doc-scrape-examples = true

[[example]]
name = "broadcast_transfer"
doc-scrape-examples = true

[package.metadata.docs.rs]
all-features = false
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
eld_common = { path = "../common", package = "eld-common" }
abci-rs = { version = "0.11.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.137"
tendermint = "0.40.0"
tendermint-rpc = { version = "0.40.0", features = ["http-client"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "net"] }
ed25519-dalek = { version = "2.2.0", features = ["pem", "pkcs8"] }
base64 = "0.22.1"
bincode = "1.3.3"
hex = { version = "0.4.3", features = ["serde"] }
rand = "0.9.0"
sha2 = "0.10.8"
reqwest = { version = "0.12.12", features = ["json"] }
url = "2.5.4"
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3.10.0"
wiremock = "0.6"

[lints]
workspace = true
