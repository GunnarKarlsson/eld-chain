# Four app + four Tendermint on one host, images pulled from ECR.
# Copy deploy/docker/local/cluster/nodes and wallets onto the box first:
#   /home/ec2-user/eld-deploy/nodes/N/{app,tendermint}
#   /home/ec2-user/eld-deploy/wallets/wallets.json
# Tags: IMAGE_VERSION_APP and IMAGE_VERSION_TM.
x-app-eld: &app-eld
  image: 565321197097.dkr.ecr.us-east-1.amazonaws.com/eld/eld-node-app:${IMAGE_VERSION_APP}
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "2"
  networks:
    - eld-network

x-tendermint: &tendermint-common
  image: 565321197097.dkr.ecr.us-east-1.amazonaws.com/eld/eld-tendermint:${IMAGE_VERSION_TM}
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "2"
  networks:
    - eld-network

services:
  eld-app-1:
    <<: *app-eld
    container_name: eld-app-1
    ports:
      - "26658:26658"  # ABCI
      - "9001:9001"
    volumes:
      - eld-data-1:/app/data
      - /home/ec2-user/eld-deploy/nodes/1/app:/app/config:ro
      - /home/ec2-user/eld-deploy/wallets/wallets.json:/app/wallets/wallets.json:ro
    environment:
      - ELD_CONSENSUS_CONFIG_PATH=/app/config/consensus_config.json
      - ELD_DB_PATH=/app/data/rocksdb
      - TENDERMINT_RPC_URL=http://tendermint-1:26657
      - ELD_CAPACITY_VALIDATOR_WALLET_NAME=wallet-capacity-validator-1
      - RUST_LOG=info,abci=warn
      - ELD_APP_VERSION=${IMAGE_VERSION_APP}

  eld-app-2:
    <<: *app-eld
    container_name: eld-app-2
    ports:
      - "26668:26658"
      - "9002:9001"
    volumes:
      - eld-data-2:/app/data
      - /home/ec2-user/eld-deploy/nodes/2/app:/app/config:ro
      - /home/ec2-user/eld-deploy/wallets/wallets.json:/app/wallets/wallets.json:ro
    environment:
      - ELD_CONSENSUS_CONFIG_PATH=/app/config/consensus_config.json
      - ELD_DB_PATH=/app/data/rocksdb
      - TENDERMINT_RPC_URL=http://tendermint-2:26657
      - ELD_CAPACITY_VALIDATOR_WALLET_NAME=wallet-capacity-validator-2
      - RUST_LOG=info,abci=warn
      - ELD_APP_VERSION=${IMAGE_VERSION_APP}

  eld-app-3:
    <<: *app-eld
    container_name: eld-app-3
    ports:
      - "26678:26658"
      - "9003:9001"
    volumes:
      - eld-data-3:/app/data
      - /home/ec2-user/eld-deploy/nodes/3/app:/app/config:ro
      - /home/ec2-user/eld-deploy/wallets/wallets.json:/app/wallets/wallets.json:ro
    environment:
      - ELD_CONSENSUS_CONFIG_PATH=/app/config/consensus_config.json
      - ELD_DB_PATH=/app/data/rocksdb
      - TENDERMINT_RPC_URL=http://tendermint-3:26657
      - ELD_CAPACITY_VALIDATOR_WALLET_NAME=wallet-capacity-validator-3
      - RUST_LOG=info,abci=warn
      - ELD_APP_VERSION=${IMAGE_VERSION_APP}

  eld-app-4:
    <<: *app-eld
    container_name: eld-app-4
    ports:
      - "26688:26658"
      - "9004:9001"
    volumes:
      - eld-data-4:/app/data
      - /home/ec2-user/eld-deploy/nodes/4/app:/app/config:ro
      - /home/ec2-user/eld-deploy/wallets/wallets.json:/app/wallets/wallets.json:ro
    environment:
      - ELD_CONSENSUS_CONFIG_PATH=/app/config/consensus_config.json
      - ELD_DB_PATH=/app/data/rocksdb
      - TENDERMINT_RPC_URL=http://tendermint-4:26657
      - ELD_CAPACITY_VALIDATOR_WALLET_NAME=wallet-capacity-validator-4
      - RUST_LOG=info,abci=warn
      - ELD_APP_VERSION=${IMAGE_VERSION_APP}

  tendermint-1:
    <<: *tendermint-common
    container_name: tendermint-1
    ports:
      - "26656:26656"  # P2P
      - "26657:26657"  # RPC
      - "26660:26660"  # Prometheus
    volumes:
      - tendermint-data-1:/tendermint/.tendermint/data
      - /home/ec2-user/eld-deploy/nodes/1/tendermint:/tendermint/.tendermint/config
    environment:
      - TMHOME=/tendermint/.tendermint
      - PROXY_APP=tcp://eld-app-1:26658
    depends_on:
      eld-app-1:
        condition: service_started

  tendermint-2:
    <<: *tendermint-common
    container_name: tendermint-2
    ports:
      - "26666:26656"  # P2P
      - "26667:26657"  # RPC
      - "26670:26660"  # Prometheus
    volumes:
      - tendermint-data-2:/tendermint/.tendermint/data
      - /home/ec2-user/eld-deploy/nodes/2/tendermint:/tendermint/.tendermint/config
    environment:
      - TMHOME=/tendermint/.tendermint
      - PROXY_APP=tcp://eld-app-2:26668
    depends_on:
      eld-app-2:
        condition: service_started

  tendermint-3:
    <<: *tendermint-common
    container_name: tendermint-3
    ports:
      - "26676:26656"  # P2P
      - "26677:26657"  # RPC
      - "26680:26660"  # Prometheus
    volumes:
      - tendermint-data-3:/tendermint/.tendermint/data
      - /home/ec2-user/eld-deploy/nodes/3/tendermint:/tendermint/.tendermint/config
    environment:
      - TMHOME=/tendermint/.tendermint
      - PROXY_APP=tcp://eld-app-3:26678
    depends_on:
      eld-app-3:
        condition: service_started

  tendermint-4:
    <<: *tendermint-common
    container_name: tendermint-4
    ports:
      - "26686:26656"  # P2P
      - "26687:26657"  # RPC
      - "26690:26660"  # Prometheus
    volumes:
      - tendermint-data-4:/tendermint/.tendermint/data
      - /home/ec2-user/eld-deploy/nodes/4/tendermint:/tendermint/.tendermint/config
    environment:
      - TMHOME=/tendermint/.tendermint
      - PROXY_APP=tcp://eld-app-4:26688
    depends_on:
      eld-app-4:
        condition: service_started

volumes:
  eld-data-1:
    driver: local
  eld-data-2:
    driver: local
  eld-data-3:
    driver: local
  eld-data-4:
    driver: local
  tendermint-data-1:
    driver: local
  tendermint-data-2:
    driver: local
  tendermint-data-3:
    driver: local
  tendermint-data-4:
    driver: local

networks:
  eld-network:
    name: eld-network
    driver: bridge
