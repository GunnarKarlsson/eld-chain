# One app + one Tendermint, using cluster node 1's config and keys.
# Service names stay eld-app-1 / tendermint-1 so node 1's config.toml
# (proxy_app = tcp://eld-app-1:26658) still resolves.
# Node 1 genesis lists four validators, so this pair does not produce blocks.
name: eld-single

x-app-log: &app-log
  RUST_LOG: eld_node=info,eld_common=info,eld_client=info,abci=warn

x-app-eld: &app-eld
  image: eld-app:${NODE_APP_VERSION_TAG}
  pull_policy: never
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "2"
  networks:
    - eld-network
  environment:
    <<: *app-log

x-tendermint: &tendermint-common
  image: eld-tendermint:${TENDERMINT_VERSION_TAG}
  pull_policy: never
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "2"
  networks:
    - eld-network

services:
  eld-app-1:
    <<: *app-eld
    container_name: eld-app-1
    ports:
      - "8000:8000"    # Content API
      - "26658:26658"  # ABCI
      - "8085:8085"    # WebSocket
      - "8885:8885"
      - "9001:9001"
    volumes:
      - eld-data-1:/app/data
      - ../cluster/nodes/1/app:/app/config:ro
      - ../cluster/wallets/wallets.json:/app/wallets/wallets.json:ro
    environment:
      <<: *app-log
      ELD_CONSENSUS_CONFIG_PATH: /app/config/consensus_config.json
      ELD_DB_PATH: /app/data/rocksdb
      TENDERMINT_RPC_URL: http://tendermint-1:26657
      ELD_CAPACITY_VALIDATOR_WALLET_NAME: wallet-capacity-validator-1

  tendermint-1:
    <<: *tendermint-common
    container_name: tendermint-1
    ports:
      - "26656:26656"  # P2P
      - "26657:26657"  # RPC
      - "26660:26660"  # Prometheus
    volumes:
      - tendermint-data-1:/tendermint/.tendermint/data
      - ../cluster/nodes/1/tendermint:/tendermint/.tendermint/config
    environment:
      - TMHOME=/tendermint/.tendermint
      - PROXY_APP=tcp://eld-app-1:26658
    depends_on:
      eld-app-1:
        condition: service_started

volumes:
  eld-data-1:
    driver: local
  tendermint-data-1:
    driver: local

networks:
  eld-network:
    driver: bridge
