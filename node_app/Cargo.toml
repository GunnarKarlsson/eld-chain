[package]
name = "eld-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Eld ABCI node application"
readme = "README.md"
authors = ["Gunnar H. Karlsson <gunnar.h.karlsson@gmail.com>"]
repository = "https://github.com/eldnetwork/eld-chain"
homepage = "https://github.com/eldnetwork/eld-chain"
keywords = ["blockchain", "tendermint", "abci"]
publish = false

[[bin]]
name = "eld-node"
path = "src/main.rs"

[dependencies]
abci-rs = { version = "0.11.3", features = ["use-tokio"] }
async-trait = "0.1.77"
axum = { version = "0.8.1", features = ["ws"] }
eld_common = { path = "../common", version = "0.1.0", package = "eld-common" }
eld_client = { path = "../client", version = "0.1.0", package = "eld-client" }
base64 = "0.22.1"
bincode = "1.3.3"
bytes = "1.5.0"
clap = { version = "4.0", features = ["derive"] }
hex = "0.4.3"
libc = "0.2"
rocksdb = "0.21.0"
serde = "1.0.217"
serde_json = "1.0"
sha2 = "0.10.8"
blake3 = "1.5"
tendermint-rpc = "0.40.1"
tokio = { version = "1.43.0", features = ["full"] }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "time"] }
url = "2.4"
chrono = "0.4.40"
futures-util = "0.3"
rand = "0.9.0"
ed25519-dalek = { version = "2.1.1", features = ["pem", "pkcs8"] }
lz4 = "1.24.0"
tower = { version = "0.4", features = ["util", "limit"] }
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", features = ["json"] }
patricia_tree = "0.10.1"
trie-db = "=0.31.0"
memory-db = "0.32"
hash-db = "0.16"
reference-trie = "=0.29.2"
hash256-std-hasher = "0.15.2"
libp2p = { version = "0.53.2", features = [
    "tcp",
    "noise",
    "yamux",
    "gossipsub",
    "mdns",
    "quic",
    "tokio",
    "macros",
] }

[dev-dependencies]
tempfile = "3.10.0"

[lints]
workspace = true
