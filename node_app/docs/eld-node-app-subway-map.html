<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eld Node App — Codebase Subway Map</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1.5rem;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #fff;
      color: #222;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 1rem;
    }
    .map-container {
      max-width: 100%;
      overflow: auto;
      background: #fff;
      border-radius: 8px;
      padding: 1rem;
      border: 1px solid #e5e5e5;
    }
    .map-container svg {
      display: block;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem 1.5rem;
      margin-top: 1rem;
      padding: 0.75rem;
      background: #fff;
      border-radius: 8px;
      font-size: 0.8rem;
      border: 1px solid #e5e5e5;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <h1>Eld Node App — Codebase Subway Map</h1>
  <p class="subtitle">Modules and structure of eld_node_app (stations = modules, lines = domains)</p>
  <div class="map-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 780" width="920" height="780">
      <defs>
        <filter id="station-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#444" />
        </marker>
      </defs>

      <!-- Background -->
      <rect width="920" height="780" fill="#fff" rx="4" />

      <!-- ========== LINES (tracks) - all diagonals use same slope dy/dx = 750/920 = 0.815 ========== -->
      <!-- Consensus Line (blue) -->
      <path d="M 460 340 L 260 340 L 260 120 L 160 39" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
      <path d="M 460 340 L 660 340 L 660 120 L 760 39" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
      <path d="M 260 340 L 260 520 L 160 602" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" stroke-dasharray="6 5" />
      <path d="M 660 340 L 660 520 L 760 602" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" stroke-dasharray="6 5" />

      <!-- Storage Line (green) -->
      <path d="M 460 340 L 460 520 L 380 520 L 280 602" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" stroke-dasharray="8 6" />
      <path d="M 460 340 L 340 340 L 340 80" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
      <path d="M 460 340 L 580 340 L 580 80 L 660 15" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" stroke-dasharray="8 6" />

      <!-- Capacity Line (orange) -->
      <path d="M 460 340 L 220 340 L 220 260 L 120 179" stroke="#ea580c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
      <path d="M 460 340 L 700 340 L 700 260 L 800 179" stroke="#ea580c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
      <path d="M 460 340 L 700 340 L 700 260 L 822 360" stroke="#ea580c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" stroke-dasharray="8 6" />
      <path d="M 220 340 L 220 440 L 120 522" stroke="#ea580c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" stroke-dasharray="8 6" />

      <!-- Content Line (purple) -->
      <path d="M 460 340 L 460 200 L 300 200 L 300 80 L 220 15" stroke="#7c3aed" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" stroke-dasharray="8 6" />
      <path d="M 460 200 L 620 200 L 620 80 L 700 15" stroke="#7c3aed" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

      <!-- App State Line (red) -->
      <path d="M 460 340 L 380 340 L 380 260 L 260 260 L 160 342" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
      <path d="M 460 340 L 540 340 L 540 260 L 660 260 L 760 342" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" stroke-dasharray="6 5" />

      <!-- Indexer Line (teal) dashed - same slope to bottom-right -->
      <path d="M 460 340 L 520 340 L 520 600 L 620 600 L 720 682" stroke="#0d9488" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" stroke-dasharray="6 5" />

      <!-- Error (small branch) dashed - same slope left-down -->
      <path d="M 460 340 L 400 340 L 400 640 L 300 722" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" stroke-dasharray="5 4" />

      <!-- ========== STATIONS (nodes) - labels below circle ========== -->
      <!-- Central: main -->
      <circle cx="460" cy="340" r="28" fill="#fff" stroke="#b45309" stroke-width="3" filter="url(#station-glow)" />
      <text x="460" y="382" text-anchor="middle" fill="#92400e" font-size="11" font-weight="bold">node</text>

      <!-- Consensus branch -->
      <circle cx="260" cy="340" r="18" fill="#fff" stroke="#2563eb" stroke-width="2.5" />
      <text x="260" y="376" text-anchor="middle" fill="#1e40af" font-size="9">consensus</text>
      <circle cx="260" cy="120" r="14" fill="#fff" stroke="#2563eb" stroke-width="2" />
      <text x="260" y="152" text-anchor="middle" fill="#1e40af" font-size="8">processor</text>
      <circle cx="160" cy="39" r="12" fill="#fff" stroke="#2563eb" stroke-width="2" />
      <text x="160" y="67" text-anchor="middle" fill="#3730a3" font-size="7">handlers</text>
      <circle cx="260" cy="520" r="14" fill="#fff" stroke="#2563eb" stroke-width="2" />
      <text x="260" y="552" text-anchor="middle" fill="#1e40af" font-size="8">snapshot</text>
      <circle cx="160" cy="602" r="12" fill="#fff" stroke="#2563eb" stroke-width="2" />
      <text x="160" y="630" text-anchor="middle" fill="#3730a3" font-size="7">manager</text>
      <circle cx="660" cy="340" r="18" fill="#fff" stroke="#2563eb" stroke-width="2.5" />
      <text x="660" y="376" text-anchor="middle" fill="#1e40af" font-size="9">mempool</text>
      <circle cx="660" cy="120" r="14" fill="#fff" stroke="#2563eb" stroke-width="2" />
      <text x="660" y="152" text-anchor="middle" fill="#1e40af" font-size="8">info</text>
      <circle cx="760" cy="39" r="12" fill="#fff" stroke="#2563eb" stroke-width="2" />
      <text x="760" y="67" text-anchor="middle" fill="#3730a3" font-size="7">rate</text>
      <circle cx="660" cy="520" r="14" fill="#fff" stroke="#2563eb" stroke-width="2" />
      <text x="660" y="552" text-anchor="middle" fill="#1e40af" font-size="8">validation</text>
      <circle cx="760" cy="602" r="12" fill="#fff" stroke="#2563eb" stroke-width="2" />
      <text x="760" y="630" text-anchor="middle" fill="#3730a3" font-size="7">errors</text>

      <!-- Storage branch -->
      <circle cx="460" cy="520" r="18" fill="#fff" stroke="#16a34a" stroke-width="2.5" />
      <text x="460" y="556" text-anchor="middle" fill="#166534" font-size="9">storage</text>
      <circle cx="380" cy="520" r="14" fill="#fff" stroke="#16a34a" stroke-width="2" />
      <text x="380" y="552" text-anchor="middle" fill="#166534" font-size="8">api</text>
      <circle cx="280" cy="602" r="12" fill="#fff" stroke="#16a34a" stroke-width="2" />
      <text x="280" y="630" text-anchor="middle" fill="#14532d" font-size="7">pagination</text>
      <circle cx="340" cy="340" r="14" fill="#fff" stroke="#16a34a" stroke-width="2" />
      <text x="340" y="372" text-anchor="middle" fill="#166534" font-size="8">rocksdb</text>
      <circle cx="340" cy="80" r="12" fill="#fff" stroke="#16a34a" stroke-width="2" />
      <text x="340" y="108" text-anchor="middle" fill="#14532d" font-size="7">traits</text>
      <circle cx="580" cy="340" r="14" fill="#fff" stroke="#16a34a" stroke-width="2" />
      <text x="580" y="372" text-anchor="middle" fill="#166534" font-size="8">hybrid</text>
      <circle cx="660" cy="15" r="12" fill="#fff" stroke="#16a34a" stroke-width="2" />
      <text x="660" y="43" text-anchor="middle" fill="#14532d" font-size="7">cado_key</text>

      <!-- Capacity branch -->
      <circle cx="220" cy="340" r="16" fill="#fff" stroke="#ea580c" stroke-width="2.5" />
      <text x="220" y="372" text-anchor="middle" fill="#c2410c" font-size="8">capacity</text>
      <circle cx="220" cy="260" r="12" fill="#fff" stroke="#ea580c" stroke-width="2" />
      <text x="220" y="292" text-anchor="middle" fill="#c2410c" font-size="7">capacity_mgr</text>
      <circle cx="120" cy="179" r="11" fill="#fff" stroke="#ea580c" stroke-width="2" />
      <text x="120" y="206" text-anchor="middle" fill="#9a3412" font-size="6">slot_alloc</text>
      <circle cx="220" cy="440" r="12" fill="#fff" stroke="#ea580c" stroke-width="2" />
      <text x="220" y="472" text-anchor="middle" fill="#c2410c" font-size="7">challenge</text>
      <circle cx="120" cy="522" r="11" fill="#fff" stroke="#ea580c" stroke-width="2" />
      <text x="120" y="549" text-anchor="middle" fill="#9a3412" font-size="6">merkle_tree</text>
      <circle cx="700" cy="340" r="16" fill="#fff" stroke="#ea580c" stroke-width="2.5" />
      <text x="700" y="372" text-anchor="middle" fill="#c2410c" font-size="8">capacity_reg</text>
      <circle cx="800" cy="179" r="11" fill="#fff" stroke="#ea580c" stroke-width="2" />
      <text x="800" y="206" text-anchor="middle" fill="#9a3412" font-size="6">proof_mtree</text>
      <circle cx="822" cy="360" r="12" fill="#fff" stroke="#ea580c" stroke-width="2" />
      <text x="822" y="388" text-anchor="middle" fill="#c2410c" font-size="7">ms</text>

      <!-- Content branch -->
      <circle cx="460" cy="200" r="16" fill="#fff" stroke="#7c3aed" stroke-width="2.5" />
      <text x="460" y="232" text-anchor="middle" fill="#5b21b6" font-size="8">content</text>
      <circle cx="300" cy="200" r="14" fill="#fff" stroke="#7c3aed" stroke-width="2" />
      <text x="300" y="232" text-anchor="middle" fill="#5b21b6" font-size="8">orchestrator</text>
      <circle cx="220" cy="15" r="11" fill="#fff" stroke="#7c3aed" stroke-width="2" />
      <text x="220" y="42" text-anchor="middle" fill="#4c1d95" font-size="6">sync</text>
      <circle cx="620" cy="200" r="14" fill="#fff" stroke="#7c3aed" stroke-width="2" />
      <text x="620" y="232" text-anchor="middle" fill="#5b21b6" font-size="8">sync_coord</text>
      <circle cx="700" cy="15" r="11" fill="#fff" stroke="#7c3aed" stroke-width="2" />
      <text x="700" y="42" text-anchor="middle" fill="#4c1d95" font-size="6">periodic</text>

      <!-- App State branch -->
      <circle cx="380" cy="340" r="14" fill="#fff" stroke="#dc2626" stroke-width="2" />
      <text x="380" y="372" text-anchor="middle" fill="#b91c1c" font-size="8">app_state</text>
      <circle cx="380" cy="260" r="12" fill="#fff" stroke="#dc2626" stroke-width="2" />
      <text x="380" y="292" text-anchor="middle" fill="#b91c1c" font-size="7">trie</text>
      <circle cx="160" cy="342" r="11" fill="#fff" stroke="#dc2626" stroke-width="2" />
      <text x="160" y="369" text-anchor="middle" fill="#991b1b" font-size="6">trie_snap</text>
      <circle cx="540" cy="340" r="14" fill="#fff" stroke="#dc2626" stroke-width="2" />
      <text x="540" y="372" text-anchor="middle" fill="#b91c1c" font-size="8">ptree</text>
      <circle cx="540" cy="260" r="12" fill="#fff" stroke="#dc2626" stroke-width="2" />
      <text x="540" y="292" text-anchor="middle" fill="#b91c1c" font-size="7">AppState</text>
      <circle cx="760" cy="342" r="11" fill="#fff" stroke="#dc2626" stroke-width="2" />
      <text x="760" y="369" text-anchor="middle" fill="#991b1b" font-size="6">state_version</text>

      <!-- Indexer branch (teal dashed) - node at terminus -->
      <circle cx="520" cy="340" r="12" fill="#fff" stroke="#0d9488" stroke-width="2" />
      <text x="520" y="368" text-anchor="middle" fill="#0f766e" font-size="7">indexer</text>
      <circle cx="520" cy="600" r="12" fill="#fff" stroke="#0d9488" stroke-width="2" />
      <text x="520" y="632" text-anchor="middle" fill="#0f766e" font-size="7">tx_indexer</text>
      <circle cx="720" cy="682" r="11" fill="#fff" stroke="#0d9488" stroke-width="2" />
      <text x="720" y="709" text-anchor="middle" fill="#115e59" font-size="6">tx</text>

      <!-- Error branch -->
      <circle cx="400" cy="340" r="10" fill="#fff" stroke="#94a3b8" stroke-width="2" />
      <text x="400" y="366" text-anchor="middle" fill="#64748b" font-size="6">error</text>
      <circle cx="300" cy="722" r="10" fill="#fff" stroke="#94a3b8" stroke-width="2" />
      <text x="300" y="748" text-anchor="middle" fill="#64748b" font-size="6">handle_*</text>

    </svg>
  </div>
  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#fbbf24"></span> Node (hub)</div>
    <div class="legend-item"><span class="legend-dot" style="background:#2563eb"></span> Consensus</div>
    <div class="legend-item"><span class="legend-dot" style="background:#16a34a"></span> Storage</div>
    <div class="legend-item"><span class="legend-dot" style="background:#ea580c"></span> Capacity</div>
    <div class="legend-item"><span class="legend-dot" style="background:#7c3aed"></span> Content</div>
    <div class="legend-item"><span class="legend-dot" style="background:#dc2626"></span> App State</div>
    <div class="legend-item"><span class="legend-dot" style="background:#0d9488"></span> Indexer</div>
    <div class="legend-item"><span class="legend-dot" style="background:#94a3b8"></span> Error</div>
  </div>
</body>
</html>
