[package]
name = "eld-common"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Shared types, transaction wire format, and validation for Eld"
readme = "README.md"
authors = ["Gunnar H. Karlsson <gunnar.h.karlsson@gmail.com>"]
repository = "https://github.com/eldnetwork/eld-chain"
homepage = "https://github.com/eldnetwork/eld-chain"
documentation = "https://docs.rs/eld-common"
keywords = ["blockchain", "tendermint", "cosmos"]
categories = ["cryptocurrency", "encoding"]
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
    "TYPE_DESIGN.md",
    "CHANGELOG.md",
]
publish = false

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.137"
tendermint = "0.40.0"
ed25519-dalek = { version = "2.2.0", features = ["pem","pkcs8"] }
base64 = "0.22.1"
bincode = "1.3.3"
serde-big-array = "0.5.1"
abci-rs = { version = "0.11.3"}
parity-scale-codec = { features = ["derive"], version = "1.3" }
static_assertions = "1.1.0"
byteorder = "1.5.0"
hex = { version = "0.4.3", features = ["serde"] }
tracing = "0.1"
rand = "0.9.0"
sha2 = "0.10.8"
blake3 = "1.5"
serde_with = { version = "3.12.0", features = ["hex"] }

[dev-dependencies]
tempfile = "3.10.0"

[lints]
workspace = true
